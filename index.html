<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard</title>
  <meta name="theme-color" content="#8a7a66" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1a17" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Icônes (trait 1.8, même famille partout) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/></symbol>
      <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H9a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H4z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H15a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H20z"/></symbol>
      <symbol id="i-goals" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-breakfast" viewBox="0 0 24 24"><path d="M3 18h18M7 18a5 5 0 0 1 10 0"/><path d="M12 6v3M5.6 9.6l1.8 1.8M18.4 9.6l-1.8 1.8"/></symbol>
      <symbol id="i-lunch" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
      <symbol id="i-snack" viewBox="0 0 24 24"><path d="M12 8c-1.5-1.5-6-1.6-6.5 3.2C5 16 8 20 10 20c1 0 1.3-.5 2-.5s1 .5 2 .5c2 0 5-4 4.5-8.8C18 6.4 13.5 6.5 12 8z"/><path d="M12 8c0-2 1-3.5 2.5-4"/></symbol>
      <symbol id="i-dinner" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></symbol>
      <symbol id="i-other" viewBox="0 0 24 24"><path d="M12 3.5l2.2 5.3 5.3 2.2-5.3 2.2L12 18.5l-2.2-5.3L4.5 11l5.3-2.2z"/></symbol>
    </defs>
  </svg>

  <div class="wallpaper" aria-hidden="true"></div>

  <!-- Connexion -->
  <main id="login" class="login" hidden>
    <form id="login-form" class="clear-glass login-card">
      <h1>Bonjour</h1>
      <p class="soft">Connecte-toi pour retrouver ton journal sur tous tes appareils.</p>
      <label>E-mail<input name="email" type="email" autocomplete="username" required></label>
      <label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Se connecter</button>
      <p class="error" id="login-error" role="alert"></p>
    </form>
  </main>

  <!-- Application -->
  <main id="app" class="app" hidden>
    <header class="topbar clear-glass">
      <img class="topbar-icon" src="icons/icon-192.png" alt="" width="34" height="34">
      <nav class="day-nav" aria-label="Jour">
        <button class="round-btn" id="prev-day" aria-label="Jour précédent"><svg><use href="#i-left"/></svg></button>
        <button class="day-label" id="today-btn"></button>
        <button class="round-btn" id="next-day" aria-label="Jour suivant"><svg><use href="#i-right"/></svg></button>
      </nav>
    </header>

    <nav class="dock clear-glass" aria-label="Actions">
      <button class="dock-btn" id="dock-add" aria-label="Ajouter un aliment"><svg><use href="#i-plus"/></svg></button>
      <button class="dock-btn" id="open-library" aria-label="Bibliothèque"><svg><use href="#i-library"/></svg></button>
      <button class="dock-btn" id="open-goals" aria-label="Objectifs et réglages"><svg><use href="#i-goals"/></svg></button>
    </nav>

    <section class="clear-glass summary" id="summary" aria-live="polite"></section>

    <div class="meal-tabs clear-glass" id="meal-tabs" role="tablist"></div>

    <section class="grid" id="grid"></section>
  </main>

  <!-- Fiche aliment / recette -->
  <dialog id="item-dialog" class="sheet">
    <form id="item-form" method="dialog">
      <header class="sheet-head">
        <h2 id="item-title">Nouvel aliment</h2>
        <button class="round-btn" value="cancel" formnovalidate aria-label="Fermer"><svg><use href="#i-close"/></svg></button>
      </header>
      <div class="segmented">
        <label><input type="radio" name="kind" value="food" checked><span>Aliment</span></label>
        <label><input type="radio" name="kind" value="recipe"><span>Recette</span></label>
      </div>
      <div class="row">
        <label class="emoji-field">Icône<input name="emoji" maxlength="4" placeholder="🍽️"></label>
        <label class="grow">Nom<input name="name" required></label>
      </div>
      <label>Une portion =<input name="portion" placeholder="1 bol, 100 g, 2 tranches…" required></label>
      <div class="macros-fields">
        <label>Calories<input name="kcal" type="number" inputmode="decimal" min="0" step="any" required></label>
        <label>Protéines (g)<input name="protein" type="number" inputmode="decimal" min="0" step="any" required></label>
        <label>Glucides (g)<input name="carbs" type="number" inputmode="decimal" min="0" step="any" required></label>
        <label>Lipides (g)<input name="fat" type="number" inputmode="decimal" min="0" step="any" required></label>
      </div>
      <fieldset>
        <legend>Proposé pour</legend>
        <div class="chips" id="meal-checks"></div>
      </fieldset>
      <label>Ingrédients <span class="muted">(un par ligne : « Avoine : 40 g »)</span>
        <textarea name="ingredients" rows="3"></textarea></label>
      <label>Description <span class="muted">(facultatif)</span><textarea name="description" rows="2"></textarea></label>
      <label>Image <span class="muted">(lien, facultatif)</span><input name="image_url" type="url" placeholder="https://…"></label>
      <label class="toggle"><input type="checkbox" name="favorite"> Favori</label>
      <footer class="sheet-foot">
        <button class="btn danger" type="button" id="delete-item" hidden>Supprimer</button>
        <button class="btn primary" value="save">Enregistrer</button>
      </footer>
    </form>
  </dialog>

  <!-- Bibliothèque -->
  <dialog id="library-dialog" class="sheet">
    <header class="sheet-head">
      <h2>Bibliothèque</h2>
      <button class="round-btn" data-close aria-label="Fermer"><svg><use href="#i-close"/></svg></button>
    </header>
    <button class="btn primary wide" id="new-item"><svg><use href="#i-plus"/></svg>Nouvel aliment ou recette</button>
    <div id="library-list" class="library-list"></div>
  </dialog>

  <!-- Objectifs et réglages -->
  <dialog id="goals-dialog" class="sheet">
    <form id="goals-form" method="dialog">
      <header class="sheet-head">
        <h2>Objectifs du jour</h2>
        <button class="round-btn" value="cancel" formnovalidate aria-label="Fermer"><svg><use href="#i-close"/></svg></button>
      </header>
      <div class="macros-fields">
        <label>Calories<input name="kcal" type="number" inputmode="decimal" min="1" step="any" required></label>
        <label>Protéines (g)<input name="protein" type="number" inputmode="decimal" min="0" step="any" required></label>
        <label>Glucides (g)<input name="carbs" type="number" inputmode="decimal" min="0" step="any" required></label>
        <label>Lipides (g)<input name="fat" type="number" inputmode="decimal" min="0" step="any" required></label>
      </div>
      <button class="btn primary wide" value="save">Enregistrer</button>
      <hr>
      <button class="btn wide" type="button" id="export-btn"><svg><use href="#i-download"/></svg>Exporter mes données</button>
      <button class="btn wide" type="button" id="logout-btn">Se déconnecter</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
