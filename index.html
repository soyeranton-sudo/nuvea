<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nuvéa</title>
  <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nuvéa">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <!-- Connexion -->
  <main id="login" class="login" hidden>
    <form id="login-form" class="glass login-card">
      <div class="brand">Nuvéa</div>
      <p class="muted">Ton journal nutrition, au même endroit sur tous tes appareils.</p>
      <label>E-mail<input name="email" type="email" autocomplete="username" required></label>
      <label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Se connecter</button>
      <p class="error" id="login-error" role="alert"></p>
    </form>
  </main>

  <!-- Application -->
  <main id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">Nuvéa</div>
      <div class="topbar-actions">
        <button class="icon-btn" id="open-library" aria-label="Bibliothèque">📚</button>
        <button class="icon-btn" id="open-goals" aria-label="Objectifs et réglages">⚙️</button>
      </div>
    </header>

    <nav class="day-nav" aria-label="Jour">
      <button class="icon-btn" id="prev-day" aria-label="Jour précédent">‹</button>
      <button class="day-label" id="today-btn"></button>
      <button class="icon-btn" id="next-day" aria-label="Jour suivant">›</button>
    </nav>

    <section class="glass summary" id="summary" aria-live="polite"></section>

    <div class="meal-tabs" id="meal-tabs" role="tablist"></div>

    <section class="grid" id="grid"></section>
  </main>

  <!-- Fiche aliment / recette -->
  <dialog id="item-dialog" class="sheet">
    <form id="item-form" method="dialog">
      <header class="sheet-head">
        <h2 id="item-title">Nouvel aliment</h2>
        <button class="icon-btn" value="cancel" formnovalidate aria-label="Fermer">✕</button>
      </header>
      <div class="segmented">
        <label><input type="radio" name="kind" value="food" checked><span>Aliment</span></label>
        <label><input type="radio" name="kind" value="recipe"><span>Recette</span></label>
      </div>
      <div class="row">
        <label class="emoji-field">Icône<input name="emoji" maxlength="4" placeholder="🍽️"></label>
        <label class="grow">Nom<input name="name" required></label>
      </div>
      <label>Une portion =<input name="portion" placeholder="1 bol, 100 g, 2 tranches…" required></label>
      <div class="macros-fields">
        <label>Calories<input name="kcal" type="number" inputmode="decimal" min="0" step="any" required></label>
        <label>Protéines (g)<input name="protein" type="number" inputmode="decimal" min="0" step="any" required></label>
        <label>Glucides (g)<input name="carbs" type="number" inputmode="decimal" min="0" step="any" required></label>
        <label>Lipides (g)<input name="fat" type="number" inputmode="decimal" min="0" step="any" required></label>
      </div>
      <fieldset>
        <legend>Proposé pour</legend>
        <div class="chips" id="meal-checks"></div>
      </fieldset>
      <label>Ingrédients <span class="muted">(un par ligne : « Avoine : 40 g »)</span>
        <textarea name="ingredients" rows="3"></textarea></label>
      <label>Description <span class="muted">(facultatif)</span><textarea name="description" rows="2"></textarea></label>
      <label>Image <span class="muted">(lien, facultatif)</span><input name="image_url" type="url" placeholder="https://…"></label>
      <label class="toggle"><input type="checkbox" name="favorite"> Favori</label>
      <footer class="sheet-foot">
        <button class="btn danger" type="button" id="delete-item" hidden>Supprimer</button>
        <button class="btn primary" value="save">Enregistrer</button>
      </footer>
    </form>
  </dialog>

  <!-- Bibliothèque -->
  <dialog id="library-dialog" class="sheet">
    <header class="sheet-head">
      <h2>Bibliothèque</h2>
      <button class="icon-btn" data-close aria-label="Fermer">✕</button>
    </header>
    <button class="btn primary wide" id="new-item">＋ Nouvel aliment ou recette</button>
    <div id="library-list" class="library-list"></div>
  </dialog>

  <!-- Objectifs et réglages -->
  <dialog id="goals-dialog" class="sheet">
    <form id="goals-form" method="dialog">
      <header class="sheet-head">
        <h2>Objectifs du jour</h2>
        <button class="icon-btn" value="cancel" formnovalidate aria-label="Fermer">✕</button>
      </header>
      <div class="macros-fields">
        <label>Calories<input name="kcal" type="number" inputmode="decimal" min="1" step="any" required></label>
        <label>Protéines (g)<input name="protein" type="number" inputmode="decimal" min="0" step="any" required></label>
        <label>Glucides (g)<input name="carbs" type="number" inputmode="decimal" min="0" step="any" required></label>
        <label>Lipides (g)<input name="fat" type="number" inputmode="decimal" min="0" step="any" required></label>
      </div>
      <button class="btn primary wide" value="save">Enregistrer</button>
      <hr>
      <button class="btn wide" type="button" id="export-btn">⬇︎ Exporter mes données (sauvegarde)</button>
      <button class="btn wide" type="button" id="logout-btn">Se déconnecter</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
